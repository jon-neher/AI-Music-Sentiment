name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements-dev.txt
      - name: api import smoke
        working-directory: api
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: python -c "from app import main; print('api import OK')"
      - name: api tests
        working-directory: api
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: python -m pytest -q

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: pip install -r worker/requirements.txt
      - name: worker import smoke
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_OFFLINE: "1"
        run: python -c "import worker.schedule; print('worker import OK')"

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: pip install ruff==0.7.2
      - run: ruff check api worker

  e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            project: pixel-5
            install_browsers: npx playwright install --with-deps chromium
          - os: macos-latest
            project: iphone-12
            install_browsers: npx playwright install webkit
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: install playwright browsers
        run: ${{ matrix.install_browsers }}
      - run: npm run build
      - run: npm run test:e2e -- --project=${{ matrix.project }}
