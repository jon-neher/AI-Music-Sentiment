[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv-api", ".venv-worker", "web/dist", "web/node_modules"]

[tool.ruff.lint]
# Broadened scope for cleanup: I (isort), B (flake8-bugbear), UP (pyupgrade)
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line length handled by formatter where it matters
    "B008",  # idiomatic FastAPI uses Depends() and Query() in default args
    "UP017", # upgrading timezone.utc to UTC causes issues in local py3.10 environments
]

[tool.ruff.lint.per-file-ignores]
"api/tests/*" = ["B018"]
